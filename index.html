<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Swasth Setu - Healthcare Continuity Platform</title>
  <meta name="theme-color" content="#0d9488">
  <link rel="manifest" href="manifest.json">
  <style>
    :root {
      color-scheme: light;
      --soft: #f0fdfa;
      --pri: #0d9488;
      --pri-t: #0f766e;
      --pri2: #14b8a6;
      --pri-dark: #115e59;
      --bg: #f8fafc;
      --ink: #0f172a;
      --mut: #64748b;
      --card: #ffffff;
      --line: #e2e8f0;
      --red: #ef4444;
      --amb: #f59e0b;
      --grn: #10b981;
      --inp: #ffffff;
      --inpb: #cbd5e1;
      --tagbg: #f1f5f9;
      --redbg: #fef2f2;
      --redfg: #991b1b;
      --redbd: #fecaca;
      --ambbg: #fffbeb;
      --ambfg: #92400e;
      --ambbd: #fde68a;
      --grnbg: #ecfdf5;
      --grnfg: #065f46;
      --grnbd: #a7f3d0;
      --onbg: #d1fae5;
      --onfg: #065f46;
      --offbg: #fef3c7;
      --offfg: #78350f;
      --codebg: #e6fffa;
      --fbbg: #f8fafc;
      --toastbg: #0f172a;
      --toastfg: #ffffff;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans Devanagari", sans-serif;
      background: radial-gradient(circle at 10% 15%, #f0fdfa 0%, #f8fafc 40%, #f1f5f9 100%);
      color: var(--ink);
      line-height: 1.5;
      padding-block: 0 32px;
      padding-left: max(16px, env(safe-area-inset-left, 0px));
      padding-right: max(16px, env(safe-area-inset-right, 0px));
      min-height: 100vh;
    }

    /* Top Sticky Glassmorphism Header */
    .bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      padding: 12px 18px;
      background: rgba(255, 255, 255, 0.92) !important;
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--line);
      box-shadow: 0 4px 20px -2px rgba(15, 118, 110, 0.05);
      position: sticky;
      top: 0;
      z-index: 20;
      flex-wrap: wrap;
      margin-inline: calc(-1 * max(16px, env(safe-area-inset-left, 0px)));
    }
    .brand { font-size: 20px; font-weight: 800; color: var(--pri); display: flex; align-items: center; gap: 6px; }
    .bar-r { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .bar select { padding: 6px 10px; border-radius: 8px; border: 1px solid var(--line); background: #fff; color: var(--ink); font-weight: 500; font-size: 13px; }
    
    .offbanner {
      background: var(--ambbg);
      color: var(--ambfg);
      border-bottom: 1px solid var(--ambbd);
      padding: 8px 14px;
      font-size: 13px;
      font-weight: 500;
      text-align: center;
    }

    main { max-width: 980px; margin: 0 auto; padding-block: 16px; min-width: 0; }

    /* Polished Card Surface */
    .card {
      background: var(--card);
      border: 1px solid rgba(226, 232, 240, 0.9);
      border-radius: 18px;
      padding: 20px;
      margin-bottom: 14px;
      box-shadow: 0 4px 12px -2px rgba(0, 0, 0, 0.03), 0 2px 4px -2px rgba(0, 0, 0, 0.02);
      transition: box-shadow 0.2s ease, transform 0.2s ease;
    }
    .card:hover {
      box-shadow: 0 8px 24px -4px rgba(15, 118, 110, 0.06);
    }

    h2 { margin: 0 0 6px; font-size: 20px; font-weight: 700; color: var(--ink); }
    h3 { margin: 0 0 10px; font-size: 16px; font-weight: 700; color: var(--ink); }
    .muted { color: var(--mut); font-size: 13px; }

    /* Modern Buttons */
    .btn {
      background: var(--pri);
      color: #fff;
      border: 0;
      padding: 10px 16px;
      border-radius: 10px;
      font-size: 14px;
      cursor: pointer;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.15s ease;
      box-shadow: 0 2px 6px rgba(13, 148, 136, 0.2);
    }
    .btn:hover {
      background: var(--pri-dark);
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(13, 148, 136, 0.3);
    }
    .btn.sm { padding: 6px 12px; font-size: 13px; }
    .btn.ghost { background: transparent; border: 1px solid var(--pri); color: var(--pri); box-shadow: none; }
    .btn.ghost:hover { background: var(--soft); }
    .btn.out { background: #fff; color: var(--pri-t); border: 1px solid var(--pri); box-shadow: none; }
    .btn.out:hover { background: var(--soft); }
    .btn.red { background: var(--red); box-shadow: 0 2px 6px rgba(239, 68, 68, 0.2); }
    .btn.red:hover { background: #dc2626; box-shadow: 0 4px 12px rgba(239, 68, 68, 0.3); }
    .btn.amb { background: var(--amb); box-shadow: 0 2px 6px rgba(245, 158, 11, 0.2); }
    .btn.amb:hover { background: #d97706; }
    .btn.grey { background: #64748b; box-shadow: none; }
    .btn.grey:hover { background: #475569; }

    .chip {
      border: 0;
      border-radius: 999px;
      padding: 5px 12px;
      font-size: 12px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.15s ease;
    }
    .chip.on { background: var(--onbg); color: var(--onfg); }
    .chip.off { background: var(--offbg); color: var(--offfg); }

    input, select, textarea {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--inpb);
      border-radius: 10px;
      font-size: 14px;
      font-family: inherit;
      background: var(--inp);
      color: var(--ink);
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }
    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: var(--pri);
      box-shadow: 0 0 0 3px rgba(20, 184, 166, 0.18);
    }
    label { display: block; font-size: 13px; font-weight: 600; margin: 10px 0 4px; color: #334155; }
    .grid { display: grid; gap: 14px; }
    .g2 { grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); }
    .row { display: flex; gap: 10px; align-items: flex-start; flex-wrap: wrap; }
    .row > * { flex: 1; }

    /* Modern Tabs */
    .tabs {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 2px;
      margin-bottom: 16px;
      border-bottom: 1px solid var(--line);
    }
    .tab {
      white-space: nowrap;
      background: transparent;
      color: var(--mut);
      border: 0;
      border-bottom: 3px solid transparent;
      padding: 10px 14px;
      border-radius: 0;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      transition: all 0.15s ease;
    }
    .tab:hover { color: var(--ink); }
    .tab.act { color: var(--pri); border-color: var(--pri); }
    .badge { background: var(--red); color: #fff; border-radius: 999px; padding: 1px 7px; font-size: 11px; margin-left: 4px; }

    .tags { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
    .tag { background: var(--tagbg); color: var(--ink); border-radius: 999px; padding: 4px 12px; font-size: 12px; font-weight: 500; }
    .tag.red { background: var(--redbg); color: var(--redfg); }
    .tag.grn { background: var(--grnbg); color: var(--grnfg); }
    .tag.amb { background: var(--ambbg); color: var(--ambfg); }

    /* Timeline Items */
    .tl { border-left: 3px solid var(--line); margin-left: 8px; padding-left: 18px; }
    .item { position: relative; margin-bottom: 16px; }
    .item:before {
      content: "";
      position: absolute;
      left: -24px;
      top: 6px;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--pri);
      border: 2px solid var(--card);
      box-shadow: 0 0 0 2px var(--pri2);
    }
    .item .t { font-weight: 700; font-size: 15px; }

    /* Hero Section */
    .hero {
      background: linear-gradient(135deg, #e6fffa 0%, #f0fdf4 100%) !important;
      border: 1px solid #ccfbf1 !important;
      border-radius: 20px !important;
      padding: 34px 20px !important;
      box-shadow: 0 10px 25px -5px rgba(20, 184, 166, 0.1) !important;
      text-align: center;
      margin-bottom: 16px;
    }
    .hero h1 { margin: 0 0 6px; font-size: 32px; color: var(--pri-t); font-weight: 800; letter-spacing: -0.5px; }

    .mic {
      width: auto !important;
      flex: 0 !important;
      padding: 8px 14px;
      border-radius: 10px;
      border: 1px solid var(--pri);
      background: var(--card);
      color: var(--ink);
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
    }
    .mic.on { background: var(--red); color: #fff; border-color: var(--red); animation: pulse 1s infinite; }
    @keyframes pulse { 50% { opacity: .6; } }

    .codebox {
      font-size: 36px;
      letter-spacing: 10px;
      font-weight: 800;
      color: var(--pri-t);
      text-align: center;
      background: var(--codebg);
      border-radius: 14px;
      padding: 12px;
      border: 1px dashed var(--pri2);
    }
    .qr { display: flex; justify-content: center; padding: 12px; }
    .qrfallback { font-size: 12px; word-break: break-all; background: var(--fbbg); padding: 10px; border-radius: 8px; border: 1px solid var(--line); }

    .aycard { background: linear-gradient(135deg, #f59e0b, #ea580c); color: #fff; border-radius: 18px; padding: 20px; box-shadow: 0 8px 20px rgba(234, 88, 12, 0.25); }
    .aycard .big { font-size: 32px; font-weight: 800; }
    .meter { height: 12px; background: rgba(255, 255, 255, .35); border-radius: 99px; overflow: hidden; margin: 10px 0; }
    .meter > div { height: 100%; background: #fff; border-radius: 99px; }

    .alert { border-radius: 14px; padding: 14px; margin-bottom: 12px; }
    .alert.red { background: var(--redbg); border: 1px solid var(--redbd); color: var(--redfg); }
    .alert.amb { background: var(--ambbg); border: 1px solid var(--ambbd); color: var(--ambfg); }
    .alert.grn { background: var(--grnbg); border: 1px solid var(--grnbd); color: var(--grnfg); }
    .alert .muted { color: inherit; opacity: .85; }

    .log { display: flex; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 14px; align-items: flex-start; }
    .log .h { font-family: monospace; font-size: 11px; color: var(--mut); margin-top: 2px; }
    .log.em { background: var(--redbg); padding: 8px 10px; border-radius: 10px; }

    /* Modal Styling */
    #modal {
      position: fixed;
      inset: 0;
      display: none;
      background: rgba(15, 23, 42, 0.65);
      backdrop-filter: blur(6px);
      z-index: 50;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    #modal.show { display: flex; }
    #modal .box {
      background: var(--card);
      color: var(--ink);
      border-radius: 20px;
      padding: 22px;
      max-width: 520px;
      width: 100%;
      max-height: 90vh;
      overflow: auto;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
      animation: modalPop 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }
    @keyframes modalPop {
      0% { transform: scale(0.94); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    #toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--toastbg);
      color: var(--toastfg);
      padding: 10px 20px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 500;
      display: none;
      z-index: 60;
      max-width: 90%;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
    }

    pre.draft { white-space: pre-wrap; overflow-x: auto; background: var(--fbbg); padding: 12px; border-radius: 12px; font-size: 13px; border: 1px solid var(--line); }
    details summary { cursor: pointer; font-weight: 600; color: var(--pri-t); margin-top: 6px; }

    .role { border-top: 4px solid var(--pri); }
    .role.doc { border-top-color: #2563eb; }
    .role.doc .btn { background: #2563eb; box-shadow: 0 2px 6px rgba(37, 99, 235, 0.2); }
    .role.doc .btn:hover { background: #1d4ed8; }
    .flist { margin: 8px 0 12px; padding-left: 20px; display: grid; gap: 8px; font-size: 14px; color: #475569; }

    /* Scanner Viewfinder & Laser Animation */
    .scanner-wrap {
      position: relative;
      overflow: hidden;
      border-radius: 16px;
      background: #000;
      box-shadow: 0 8px 24px rgba(0,0,0,0.3);
    }
    .scanner-reticle {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }
    .scanner-target {
      width: 200px;
      height: 200px;
      border: 2px solid #14b8a6;
      border-radius: 18px;
      box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.55);
      position: relative;
    }
    .scanner-laser {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, #14b8a6, #2dd4bf, transparent);
      box-shadow: 0 0 12px #2dd4bf, 0 0 4px #ffffff;
      animation: scanLaser 2s infinite ease-in-out;
    }
    @keyframes scanLaser {
      0% { top: 6%; opacity: 0.2; }
      50% { top: 92%; opacity: 1; }
      100% { top: 6%; opacity: 0.2; }
    }
  </style>
</head>
<body>

<header id="top"></header>
<main id="app"></main>
<div id="modal"></div>
<div id="toast"></div>

<script>
'use strict';
/* ============================================================
   Swasth Setu - Healthcare Continuity Platform (Enhanced Edition)
   Data is stored locally in localStorage. Compatible with ABHA,
   dynamic share codes, offline lockscreen emergency QRs, and 
   SHA-256 tamper-evident hash-chain audit logging.
   ============================================================ */
const LS = 'swasthsetu_v1', LSL = 'swasthsetu_lang';
const LANGCODE = { en: 'en-IN', hi: 'hi-IN', mr: 'mr-IN' };
const DAY = 86400000;

/* ---------- Translations (UI in 3 languages) ---------- */
const T = {
  en: {

    register: 'Create new patient', language: 'Language', pending: 'will sync', noRecords: 'No records yet.'
  },
  hi: {
    appName: 'स्वस्थ सेतु', tagline: 'आपका स्वास्थ्य इतिहास, आपकी अनुमति, पूरे भारत में।',
    patient: 'मरीज़', doctor: 'डॉक्टर', login: 'लॉगिन', logout: 'लॉगआउट', online: 'ऑनलाइन', offline: 'ऑफ़लाइन',
    offlineMsg: 'आप ऑफ़लाइन हैं। सब कुछ चलता रहेगा; इंटरनेट आते ही नए रिकॉर्ड सिंक हो जाएँगे।',
    timeline: 'टाइमलाइन', addRecord: 'रिकॉर्ड जोड़ें', share: 'साझा करें', access: 'एक्सेस इतिहास', wallet: 'आयुष्मान कवर',
    alerts: 'अलर्ट', emerCard: 'आपातकालीन कार्ड', checker: 'टेस्ट चेकर', patients: 'मेरे मरीज़', emergency: 'आपातकालीन एक्सेस',
    speak: 'बोलें', noVoice: 'यहाँ वॉइस इनपुट उपलब्ध नहीं है। Chrome इस्तेमाल करें (इंटरनेट चाहिए)।',
    verify: 'ऑडिट लॉग जाँचें', notes: 'नोट्स', save: 'सेव करें', bloodGroup: 'ब्लड ग्रुप', allergies: 'एलर्जी',
    conditions: 'बीमारियाँ', savedAmt: 'दोबारा टेस्ट से बचकर बचाए', selectUser: 'यूज़र चुनें', demo: 'डेमो लॉगिन',
    register: 'नया मरीज़ बनाएँ', language: 'भाषा', pending: 'सिंक होगा', noRecords: 'अभी कोई रिकॉर्ड नहीं।'
  },
  mr: {
    appName: 'स्वस्थ सेतू', tagline: 'तुमचा आरोग्य इतिहास, तुमची परवानगी, संपूर्ण भारतात.',
    patient: 'रुग्ण', doctor: 'डॉक्टर', login: 'लॉगिन', logout: 'लॉगआउट', online: 'ऑनलाइन', offline: 'ऑफलाइन',
    offlineMsg: 'तुम्ही ऑफलाइन आहात. सर्व काही चालू राहील; इंटरनेट आल्यावर नवीन नोंदी सिंक होतील.',
    timeline: 'टाइमलाइन', addRecord: 'नोंद जोडा', share: 'शेअर करा', access: 'अॅक्सेस इतिहास', wallet: 'आयुष्मान कव्हर',
    alerts: 'अलर्ट', emerCard: 'आपत्कालीन कार्ड', checker: 'टेस्ट तपासक', patients: 'माझे रुग्ण', emergency: 'आपत्कालीन अॅक्सेस',
    speak: 'बोला', noVoice: 'येथे व्हॉइस इनपुट उपलब्ध नाही. Chrome वापरा (इंटरनेट लागते).',
    verify: 'ऑडिट लॉग तपासा', notes: 'नोंदी', save: 'सेव्ह करा', bloodGroup: 'रक्तगट', allergies: 'अ‍ॅलर्जी',
    conditions: 'आजार', savedAmt: 'पुन्हा टेस्ट टाळून वाचवले', selectUser: 'युजर निवडा', demo: 'डेमो लॉगिन',
    register: 'नवीन रुग्ण तयार करा', language: 'भाषा', pending: 'सिंक होईल', noRecords: 'अजून नोंदी नाहीत.'
  }
};
let ui = { lang: localStorage.getItem(LSL) || 'en', tab: 'timeline', fakeOffline: false, view: null };
const t = (k) => (T[ui.lang] && T[ui.lang][k]) || T.en[k] || k;

/* ---------- Duplicate-test rules (Clinical Validity Window in Days) ---------- */
const DUP = {
  'CBC': { days: 7, cost: 350 }, 'HbA1c': { days: 90, cost: 600 }, 'Lipid Profile': { days: 30, cost: 700 },
  'ECG': { days: 14, cost: 300 }, 'X-Ray Chest': { days: 14, cost: 500 }, 'Thyroid Profile': { days: 60, cost: 550 },
  'Blood Sugar': { days: 2, cost: 100 }
};
const TESTS = Object.keys(DUP);
const CATS = ['Lab Test', 'Scan', 'Prescription', 'Visit Note'];
const CAT_ICON = { 'Lab Test': '🧪', 'Scan': '🩻', 'Prescription': '💊', 'Visit Note': '📝' };

/* ---------- Helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const iso = (d) => new Date(d).toISOString().slice(0, 10);
const dago = (n) => iso(Date.now() - n * DAY);
const daysSince = (d) => Math.floor((Date.now() - new Date(d).getTime()) / DAY);
const uid = () => Math.random().toString(36).slice(2, 9);
const inr = (n) => '₹' + Number(n).toLocaleString('en-IN');
const fmtTime = (ts) => new Date(ts).toLocaleString('en-IN', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' });
const isOnline = () => navigator.onLine && !ui.fakeOffline;

/* Synth Audio Feedback for Scanner */
function playBeep(freq = 880, type = 'sine', duration = 0.12) {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = type;
    osc.frequency.value = freq;
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start();
    gain.gain.exponentialRampToValueAtTime(0.00001, ctx.currentTime + duration);
    setTimeout(() => { ctx.close(); }, duration * 1000 + 100);
  } catch (e) { /* ignore audio failure */ }
}

/* ---------- SHA-256 (Sync for hash chain) ---------- */
function sha256(str) {
  const bytes = new TextEncoder().encode(str);
  const K = [], H = [];
  let n = 2, c = 0;
  while (c < 64) {
    let p = true;
    for (let i = 2; i * i <= n; i++) if (n % i === 0) { p = false; break; }
    if (p) {
      if (c < 8) H[c] = (Math.pow(n, 0.5) % 1 * 4294967296) | 0;
      K[c] = (Math.pow(n, 1 / 3) % 1 * 4294967296) | 0;
      c++;
    }
    n++;
  }
  const rr = (v, a) => (v >>> a) | (v << (32 - a));
  const l = bytes.length, words = [];
  for (let i = 0; i < l; i++) words[i >> 2] = (words[i >> 2] | 0) | (bytes[i] << (24 - (i % 4) * 8));
  words[l >> 2] = (words[l >> 2] | 0) | (0x80 << (24 - (l % 4) * 8));
  words[(((l + 8) >> 6) + 1) * 16 - 1] = l * 8;
  let h = H.slice();
  for (let j = 0; j < words.length; j += 16) {
    const w = [];
    for (let i = 0; i < 64; i++) {
      if (i < 16) w[i] = words[j + i] | 0;
      else {
        const s0 = rr(w[i - 15], 7) ^ rr(w[i - 15], 18) ^ (w[i - 15] >>> 3);
        const s1 = rr(w[i - 2], 17) ^ rr(w[i - 2], 19) ^ (w[i - 2] >>> 10);
        w[i] = (w[i - 16] + s0 + w[i - 7] + s1) | 0;
      }
    }
    let [a, b, c2, d, e, f, g, hh] = h;
    for (let i = 0; i < 64; i++) {
      const S1 = rr(e, 6) ^ rr(e, 11) ^ rr(e, 25);
      const ch = (e & f) ^ (~e & g);
      const t1 = (hh + S1 + ch + K[i] + w[i]) | 0;
      const S0 = rr(a, 2) ^ rr(a, 13) ^ rr(a, 22);
      const maj = (a & b) ^ (a & c2) ^ (b & c2);
      const t2 = (S0 + maj) | 0;
      hh = g; g = f; f = e; e = (d + t1) | 0; d = c2; c2 = b; b = a; a = (t1 + t2) | 0;
    }
    h = [(h[0] + a) | 0, (h[1] + b) | 0, (h[2] + c2) | 0, (h[3] + d) | 0, (h[4] + e) | 0, (h[5] + f) | 0, (h[6] + g) | 0, (h[7] + hh) | 0];
  }
  return h.map((x) => ('00000000' + (x >>> 0).toString(16)).slice(-8)).join('');
}

/* ---------- Hash-chain audit log ---------- */
function addLogTo(s, actor, role, pid, action, detail, ts) {
  const prev = s.logs.length ? s.logs[s.logs.length - 1].hash : 'GENESIS';
  const when = typeof ts === 'number' ? new Date(ts).toISOString() : (ts || new Date().toISOString());
  const e = { id: s.logs.length + 1, actor, role, pid, action, detail: detail || '', ts: when, prev };
  e.hash = sha256([prev, actor, role, pid, action, e.detail, when].join('|'));
  s.logs.push(e);
}
function addLog(actor, role, pid, action, detail) { addLogTo(S, actor, role, pid, action, detail); }
function verifyChain() {
  let prev = 'GENESIS';
  for (const e of S.logs) {
    const h = sha256([prev, e.actor, e.role, e.pid, e.action, e.detail, e.ts].join('|'));
    if (e.prev !== prev || e.hash !== h) return { ok: false, id: e.id };
    prev = e.hash;
  }
  return { ok: true };
}

function commitRecord(r) {
  r.pending = !isOnline();
  S.records.push(r);
  const actor = me.role === 'doctor' ? D(me.id).name : P(me.id).name;
  addLog(actor, me.role, r.pid, me.role === 'doctor' ? 'RECORD_ADDED' : 'RECORD_UPLOADED', r.cat + ': ' + r.title);
  save(); toast(r.pending ? 'Saved locally (offline) — will sync when online' : 'Record saved successfully'); render();
}
function trySync() {
  if (!isOnline()) return;
  const n = S.records.filter((r) => r.pending);
  if (n.length) { n.forEach((r) => { r.pending = false; }); save(); toast('🔄 Synced ' + n.length + ' offline record(s)'); }
}

function dupCheck(pid, test) {
  const rule = DUP[test]; if (!rule) return null;
  const rs = S.records.filter((r) => r.pid === pid && r.test === test).sort((a, b) => b.date.localeCompare(a.date));
  if (!rs.length) return null;
  const r = rs[0], ago = daysSince(r.date);
  if (ago < rule.days) return { r, ago, rule, nextOk: iso(new Date(r.date).getTime() + rule.days * DAY) };
  return null;
}

/* ============================================================
   ENHANCED SCANNER MODULE: Multi-Format Intelligent QR Decoder
   Handles: 
   1. Dynamic Share Codes (SWASTHSETU:123456)
   2. Offline Emergency Lockscreen Cards (EMERGENCY|...)
   3. Direct 6-Digit Codes
   ============================================================ */
let scanStream = null, scanRaf = 0, currentTrack = null, torchActive = false;

function stopScan() {
  cancelAnimationFrame(scanRaf);
  if (scanStream) {
    scanStream.getTracks().forEach((tr) => tr.stop());
    scanStream = null;
    currentTrack = null;
    torchActive = false;
  }
}

function openByCode(code) {
  const g = S.grants.find((x) => x.code === code && !x.revoked && new Date(x.exp) > new Date());
  if (!g) { toast('Invalid or expired share code'); return false; }
  g.did = me.id;
  addLog(D(me.id).name, 'doctor', g.pid, 'VIEWED_RECORDS', 'Opened via share code');
  save();
  ui.view = { pid: g.pid, mode: 'grant' };
  playBeep(980, 'sine', 0.15);
  if (navigator.vibrate) navigator.vibrate(80);
  toast('Access granted for ' + P(g.pid).name);
  render();
  return true;
}

function handleScannedData(rawText) {
  const txt = String(rawText).trim();

  // Format 1: Standard Swasth Setu Share QR or direct 6-digit PIN
  const m = txt.match(/SWASTHSETU:(\d{6})/) || txt.match(/^(\d{6})$/);
  if (m) {
    stopScan();
    closeModal();
    return openByCode(m[1]);
  }

  // Format 2: Offline Emergency Lockscreen Card QR
  if (txt.startsWith('EMERGENCY|')) {
    stopScan();
    closeModal();
    playBeep(440, 'triangle', 0.25);
    if (navigator.vibrate) navigator.vibrate([100, 50, 100]);
    const parts = txt.split('|');
    const name = parts[1] || 'Unknown Patient';
    const blood = (parts[2] || '').replace('Blood:', '');
    const allergy = (parts[3] || '').replace('Allergy:', '');
    const cond = (parts[4] || '').replace('Cond:', '');
    const meds = (parts[5] || '').replace('Meds:', '');
    const callStr = (parts[6] || '').replace('Call:', '');

    modal(`
      <div class="alert red">
        <h2>🚨 EMERGENCY QR DETECTED</h2>
        <div class="muted">Scanned directly from offline emergency card / lock-screen.</div>
      </div>
      <div class="card" style="border: 2px solid var(--red);">
        <h2>${esc(name)}</h2>
        <div class="tags" style="margin: 8px 0 14px;">
          <span class="tag red" style="font-size:15px; font-weight:700;">🩸 Blood: ${esc(blood || 'Unknown')}</span>
          <span class="tag amb" style="font-size:15px; font-weight:700;">⚠️ Allergies: ${esc(allergy || 'None')}</span>
        </div>
        <p><b>Known Conditions:</b> ${esc(cond || 'None reported')}<br>
        <b>Active Medications:</b> ${esc(meds || 'None reported')}</p>
        <div class="alert grn" style="margin-top:12px;">
          <b>📞 Emergency Contact:</b> ${esc(callStr)}
        </div>
      </div>
      <p style="text-align:right;"><button class="btn" data-act="closeModal">Dismiss Triage Card</button></p>
    `);
    return true;
  }

  // Format 3: Generic fallback
  toast('Scanned content is not a recognized Swasth Setu code.');
  return false;
}

A.scan = async function () {
  if (!window.jsQR) { toast('Scanner library is loading. Please verify internet connectivity.'); return; }
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { toast('Camera not available on this browser. Use "Scan from Saved Image".'); return; }

  modal(`
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
      <h3 style="margin:0;">📷 Scan Patient QR Code</h3>
      <button class="btn sm grey" data-act="stopScanBtn">Close</button>
    </div>
    <div class="scanner-wrap">
      <video id="scanVid" playsinline muted style="width:100%; height:270px; object-fit:cover; display:block;"></video>
      <div class="scanner-reticle">
        <div class="scanner-target">
          <div class="scanner-laser"></div>
        </div>
      </div>
      <div style="position:absolute; bottom:10px; left:0; right:0; display:flex; justify-content:center; gap:8px;">
        <button id="torchBtn" type="button" class="btn sm" style="background:rgba(255,255,255,0.25); backdrop-filter:blur(6px); color:#fff; display:none;">🔦 Flashlight</button>
      </div>
    </div>
    <p class="muted" style="text-align:center; margin:8px 0 0;">Align the patient's Share QR or Offline Emergency Card within the frame.</p>
  `);

  try {
    scanStream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 720 } }
    });
    currentTrack = scanStream.getVideoTracks()[0];
  } catch (e) {
    closeModal();
    toast('Camera access was denied. Please allow permissions or upload a photo.');
    return;
  }

  const v = $('#scanVid');
  v.srcObject = scanStream;
  try { await v.play(); } catch (e) { /* ignore */ }

  // Flashlight / Torch Support Check
  const torchBtn = $('#torchBtn');
  if (torchBtn && currentTrack && typeof currentTrack.getCapabilities === 'function') {
    const caps = currentTrack.getCapabilities();
    if (caps.torch) {
      torchBtn.style.display = 'inline-flex';
      torchBtn.onclick = async () => {
        torchActive = !torchActive;
        await currentTrack.applyConstraints({ advanced: [{ torch: torchActive }] });
        torchBtn.textContent = torchActive ? '⚡ Torch Off' : '🔦 Torch On';
      };
    }
  }

  const c = document.createElement('canvas');
  const x = c.getContext('2d', { willReadFrequently: true });
  const tick = () => {
    if (!scanStream) return;
    if (v.readyState >= 2 && v.videoWidth) {
      c.width = v.videoWidth;
      c.height = v.videoHeight;
      x.drawImage(v, 0, 0);
      const d = x.getImageData(0, 0, c.width, c.height);
      const r = window.jsQR(d.data, d.width, d.height, { inversionAttempts: 'attemptBoth' });
      if (r && r.data) {
        if (handleScannedData(r.data)) return;
      }
    }
    scanRaf = requestAnimationFrame(tick);
  };
  tick();
};
A.stopScanBtn = function () { stopScan(); closeModal(); };

/* Scan From Photo / Screenshot */
document.addEventListener('change', (e) => {
  if (e.target.id !== 'qrFile') return;
  const file = e.target.files[0];
  if (!file) return;
  if (!window.jsQR) { toast('Scanner library is loading. Please check internet.'); return; }
  const img = new Image(), url = URL.createObjectURL(file);
  img.onload = () => {
    const sc = Math.min(1, 1200 / Math.max(img.width, img.height));
    const c = document.createElement('canvas');
    c.width = Math.round(img.width * sc);
    c.height = Math.round(img.height * sc);
    const x = c.getContext('2d');
    x.drawImage(img, 0, 0, c.width, c.height);
    const d = x.getImageData(0, 0, c.width, c.height);
    const r = window.jsQR(d.data, d.width, d.height, { inversionAttempts: 'attemptBoth' });
    URL.revokeObjectURL(url);
    e.target.value = '';
    if (r && r.data) {
      handleScannedData(r.data);
    } else {
      toast('No recognizable Swasth Setu QR found in this image. Try a clearer image.');
    }
  };
  img.onerror = () => toast('Could not load image file.');
  img.src = url;
});

/* ---------- Event Listeners ---------- */
document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const fn = A[el.dataset.act];
  if (fn) fn(el.dataset.arg, el);
});
document.addEventListener('submit', (e) => {
  const f = e.target.closest('form[data-form]');
  if (!f) return;
  e.preventDefault();
  F[f.dataset.form](f);
});
document.addEventListener('change', (e) => {
  if (e.target.id === 'lang') {
    ui.lang = e.target.value;
    localStorage.setItem(LSL, ui.lang);
    render();
  }
});
window.addEventListener('online', () => { trySync(); render(); });
window.addEventListener('offline', () => { render(); });
window.addEventListener('storage', (e) => {
  if (e.key === LS && e.newValue) {
    try { S = JSON.parse(e.newValue); render(); } catch (x) { /* ignore */ }
  }
});

render();
</script>
